name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore OddSnap.sln --locked-mode

      - name: Audit NuGet dependencies
        run: dotnet list OddSnap.sln package --vulnerable --include-transitive

      - name: Verify formatting and analyzers
        run: |
          dotnet format whitespace OddSnap.sln --verify-no-changes --no-restore
          dotnet format style OddSnap.sln --verify-no-changes --severity warn --no-restore
          dotnet format analyzers OddSnap.sln --verify-no-changes --severity warn --no-restore

      - name: Build
        run: dotnet build OddSnap.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test src/OddSnap.Tests/OddSnap.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
