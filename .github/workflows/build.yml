name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore OddSnap.sln --locked-mode

      - name: Audit NuGet dependencies
        run: dotnet list OddSnap.sln package --vulnerable --include-transitive

      - name: Verify formatting and analyzers
        run: |
          dotnet format whitespace OddSnap.sln --verify-no-changes --no-restore
          dotnet format style OddSnap.sln --verify-no-changes --severity warn --no-restore
          dotnet format analyzers OddSnap.sln --verify-no-changes --severity warn --no-restore

      - name: Build
        run: dotnet build OddSnap.sln -c Release --no-restore -warnaserror

      - name: Publish smoke test
        run: dotnet publish src/OddSnap/OddSnap.csproj -c Release -r win-x64 --self-contained true --no-restore -warnaserror

      - name: Test
        run: dotnet test --project src/OddSnap.Tests/OddSnap.Tests.csproj -c Release --no-build --minimum-expected-tests 1
